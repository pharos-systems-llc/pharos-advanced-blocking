name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # Needed for keyless OIDC Cosign signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run unit tests
        run: go test ./... -v

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release has assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset_count=$(gh release view "${{ github.ref_name }}" --json assets --jq '.assets | length')
          echo "Published release ${{ github.ref_name }} has $asset_count asset(s)."
          if [ "$asset_count" -eq 0 ]; then
            echo "::error::Release ${{ github.ref_name }} was published with zero assets. Failing the job so this can't ship silently broken."
            exit 1
          fi
